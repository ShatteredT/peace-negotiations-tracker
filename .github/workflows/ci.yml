name: CI/CD Pipeline

on:
  push:
    branches: [main, feature/**, exercise/**, streamlit-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  DATABASE_PATH: 'data/peacetalk.db'

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run flake8
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --jobs=1 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Initialize database
        run: python scripts/init_db.py

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Pydantic schemas
        run: |
          python -c "
          from src.agents.analyst_schemas import ArticleAnalysis, CategoryScore

          test = ArticleAnalysis(
              article_id='test',
              overall_sentiment=0.5,
              is_compromise_oriented=True,
              categories={
                  'diplomacy': {'score': 0.5, 'justification': 'test'},
                  'security': {'score': 0.0, 'justification': 'test'},
                  'territorial': {'score': -0.2, 'justification': 'test'},
                  'humanitarian': {'score': 0.8, 'justification': 'test'}
              }
          )
          print('Schema validation: OK')

          try:
              CategoryScore(score=1.5, justification='invalid')
              raise AssertionError('Boundary validation failed: score 1.5 was accepted')
          except ValueError:
              print('Boundary validation: OK')
          "

  db-migration:
    name: DB Migration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run DB init and verify
        run: python scripts/init_db.py

  build:
    name: Build Artifact
    needs: [lint, test, schema-validation, db-migration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create artifact
        run: |
          mkdir -p dist
          cp -r src data scripts requirements.txt README.md dist/
          cd dist && zip -r ../peacetalk-tracker-${{ github.sha }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peacetalk-tracker
          path: peacetalk-tracker-*.zip
          retention-days: 7

  release-tag:
    name: Tag Release (main only)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          VERSION=$(date +'v%Y.%m.%d-%H%M')
          git tag "$VERSION"
          git push origin "$VERSION"